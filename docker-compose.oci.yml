services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.oci}
      MYSQL_DATABASE: ${DB_NAME:-exa}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env.oci}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.oci}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=80
      - --innodb-buffer-pool-size=192M
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - exa-private

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: ${DB_NAME:-exa}
      MYSQLUSER: ${DB_USER:?Set DB_USER in .env.oci}
      MYSQLPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.oci}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.oci}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env.oci}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"
    networks:
      - exa-private

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflare_tunnel_token
    depends_on:
      - backend
    secrets:
      - cloudflare_tunnel_token
    networks:
      - exa-private

volumes:
  mysql-data:
  uploads:

secrets:
  cloudflare_tunnel_token:
    file: ./.cloudflare-tunnel-token

networks:
  exa-private:
    driver: bridge
